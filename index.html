/* ============ 日期與時段工具 ============ */
function getDateKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getActiveSession(now = new Date()) {
  if (CONFIG.bypassTimeCheckForTest) {
    return SESSIONS.find(s => s.key === CONFIG.testSessionKey) || SESSIONS[0];
  }
  const mins = now.getHours() * 60 + now.getMinutes();
  return SESSIONS.find(s => mins >= s.startMin && mins < s.endMin) || null;
}

function getNextSessionHint(now = new Date()) {
  const mins = now.getHours() * 60 + now.getMinutes();
  if (mins < 8 * 60) return '今日早場將於 08:00 開放';
  if (mins < 12 * 60) return '早場已結束，今日午場將於 12:00 開放';
  return '今日 08:00–08:30 與 12:00–12:30 時段皆已結束，請明日再來';
}

/* ============ 名額與每日次數存取（支援 Firebase 雲端或本地測試） ============ */
function getLocalSessionQuotaKey(dateKey, sessionKey) {
  return `foxiang_quota_${dateKey}_${sessionKey}`;
}
function getLocalUserCountKey(dateKey, userId) {
  return `foxiang_user_${dateKey}_${userId}`;
}

async function fetchQuotaAndUserCount(dateKey, sessionKey) {
  if (db) {
    const quotaRef = db.collection('sessions').doc(`${dateKey}_${sessionKey}`);
    const userRef = db.collection('dailyUsers').doc(`${dateKey}_${liffUserId}`);
    const [quotaSnap, userSnap] = await Promise.all([quotaRef.get(), userRef.get()]);
    const usedQuota = quotaSnap.exists ? (quotaSnap.data().used || 0) : 0;
    const userUsed = userSnap.exists ? (userSnap.data().count || 0) : 0;
    return {
      remainingQuota: Math.max(0, CONFIG.sessionQuota - usedQuota),
      userUsed
    };
  }

  const usedQuota = Number(localStorage.getItem(getLocalSessionQuotaKey(dateKey, sessionKey)) || 0);
  const userUsed = Number(localStorage.getItem(getLocalUserCountKey(dateKey, liffUserId)) || 0);
  return {
    remainingQuota: Math.max(0, CONFIG.sessionQuota - usedQuota),
    userUsed
  };
}

async function consumeOneQuotaAndUserCount(dateKey, sessionKey) {
  if (db) {
    const quotaRef = db.collection('sessions').doc(`${dateKey}_${sessionKey}`);
    const userRef = db.collection('dailyUsers').doc(`${dateKey}_${liffUserId}`);

    return await db.runTransaction(async (tx) => {
      const [quotaSnap, userSnap] = await Promise.all([tx.get(quotaRef), tx.get(userRef)]);
      const usedQuota = quotaSnap.exists ? (quotaSnap.data().used || 0) : 0;
      const userUsed = userSnap.exists ? (userSnap.data().count || 0) : 0;

      if (usedQuota >= CONFIG.sessionQuota) {
        throw new Error('QUOTA_FULL');
      }
      if (userUsed >= CONFIG.dailyUserLimit) {
        throw new Error('USER_LIMIT');
      }

      tx.set(quotaRef, { dateKey, sessionKey, used: usedQuota + 1 }, { merge: true });
      tx.set(userRef, { dateKey, userId: liffUserId, count: userUsed + 1 }, { merge: true });

      return {
        remainingQuota: Math.max(0, CONFIG.sessionQuota - (usedQuota + 1)),
        userUsed: userUsed + 1
      };
    });
  }

  const qKey = getLocalSessionQuotaKey(dateKey, sessionKey);
  const uKey = getLocalUserCountKey(dateKey, liffUserId);
  const usedQuota = Number(localStorage.getItem(qKey) || 0);
  const userUsed = Number(localStorage.getItem(uKey) || 0);

  if (usedQuota >= CONFIG.sessionQuota) throw new Error('QUOTA_FULL');
  if (userUsed >= CONFIG.dailyUserLimit) throw new Error('USER_LIMIT');

  localStorage.setItem(qKey, String(usedQuota + 1));
  localStorage.setItem(uKey, String(userUsed + 1));

  return {
    remainingQuota: Math.max(0, CONFIG.sessionQuota - (usedQuota + 1)),
    userUsed: userUsed + 1
  };
}

/* ============ 畫面狀態更新 ============ */
async function refreshStatusUI() {
  const now = new Date();
  const dateKey = getDateKey(now);
  const activeSession = getActiveSession(now);

  if (!activeSession) {
    sessionBadge.className = 'status-badge badge-closed';
    sessionBadge.textContent = '非開放時段';
    sessionInfo.textContent = getNextSessionHint(now);
    quotaText.textContent = '本時段剩餘名額：-- / 108';

    const uKey = getLocalUserCountKey(dateKey, liffUserId);
    const userUsed = Number(localStorage.getItem(uKey) || 0);
    userCountText.textContent = `今日已抽：${userUsed} / ${CONFIG.dailyUserLimit} 次`;

    if (!current && resultCard.classList.contains('hidden')) {
      controls.innerHTML = '<button id="drawBtn" disabled>非開放時段</button>';
    }
    return;
  }

  sessionBadge.className = 'status-badge badge-open';
  sessionBadge.textContent = `開放中 · ${activeSession.label}`;
  sessionInfo.textContent = '各時段名額獨立計算（108 名），額滿即止';

  try {
    const { remainingQuota, userUsed } = await fetchQuotaAndUserCount(dateKey, activeSession.key);
    quotaText.textContent = `本時段剩餘名額：${remainingQuota} / ${CONFIG.sessionQuota}`;
    userCountText.textContent = `今日已抽：${userUsed} / ${CONFIG.dailyUserLimit} 次`;

    const canDraw = remainingQuota > 0 && userUsed < CONFIG.dailyUserLimit;
    if (!current && resultCard.classList.contains('hidden')) {
      if (!canDraw) {
        const reason = remainingQuota <= 0 ? '本時段 108 名額已滿' : '今日已達 2 次上限';
        controls.innerHTML = `<button id="drawBtn" disabled>${reason}</button>`;
      } else {
        controls.innerHTML = '<button id="drawBtn">抽聖像</button>';
        document.getElementById('drawBtn').onclick = startDraw;
      }
    }
  } catch (err) {
    console.warn('refreshStatusUI error:', err);
  }
}
