
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛菩薩聖像抽選</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;text-align:center;background:linear-gradient(180deg,#fdfaf5 0%,#f7efe2 100%);color:#3a3226;padding:20px;margin:0;min-height:100vh}
#stage{max-width:440px;margin:0 auto}
h1{font-size:22px;color:#8a6d1d;letter-spacing:2px;margin-bottom:6px}
.hint{color:#9a8c78;font-size:14px;line-height:1.6;margin:6px 0 14px}
.status-panel,.today-box{background:#fff;border-radius:14px;padding:12px 16px;margin:0 auto 16px;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,.05);font-size:13px;color:#5c503e;line-height:1.65}
.status-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:4px}
.badge-open{background:#e8f5e9;color:#2e7d32}
.badge-closed{background:#f5efe6;color:#8c7b65}
.quota-row{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-top:6px;border-top:1px dashed #ede4d3;font-weight:600;color:#7a5e14}
.img-box{width:230px;height:230px;margin:18px auto;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(201,162,39,.12),0 8px 30px rgba(201,162,39,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:64px;color:#c9a227;transition:transform .2s}
.img-box.rotating{animation:pulse .18s linear infinite}
@keyframes pulse{0%{transform:scale(.96);opacity:.7}100%{transform:scale(1.04);opacity:1}}
.img-box img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:15px;color:#8a6d1d;line-height:1.6;padding:10px}
.placeholder small{color:#b0a48f;font-size:12px}
.result-name{font-size:24px;color:#8a6d1d;margin:10px 0 2px;font-weight:600;letter-spacing:1px;min-height:30px}
button{padding:13px 30px;font-size:16px;border:none;border-radius:26px;background:linear-gradient(135deg,#d4af37,#b8912a);color:#fff;cursor:pointer;margin:8px 6px;box-shadow:0 4px 14px rgba(184,145,42,.35);transition:transform .1s}
button:active{transform:scale(.97)}
button:disabled{background:#ccc;box-shadow:none;cursor:not-allowed}
button.ghost{background:#fff;color:#8a6d1d;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.jiao{font-size:30px;letter-spacing:10px;margin:12px;min-height:38px;color:#8a6d1d}
.msg{color:#9a8c78;font-size:14px;min-height:20px;margin:4px 0 8px;line-height:1.6}
.card{text-align:left;max-width:380px;margin:16px auto;line-height:1.8;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card .label{color:#b8912a;font-weight:600;font-size:14px}
.card .blessing{color:#8a6d1d;font-style:italic;margin-top:12px;font-size:15px}
.card .sutra{color:#a89c88;font-size:12px;margin-top:12px;line-height:1.7;border-top:1px dashed #e5dccb;padding-top:10px}
.today-label{font-size:12px;color:#b8912a;letter-spacing:1px}
.today-name{font-size:19px;color:#8a6d1d;font-weight:600;margin:4px 0}
.today-blessing{font-size:13px;color:#9a8c78}
.small{font-size:12px;color:#b0a48f;margin-top:26px;line-height:1.6}
.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
<h1>佛菩薩聖像抽選</h1>
<p class="hint">靜心默念，抽一尊與你有緣的佛菩薩，再擲筊請示。<br>開放時段：每日 08:00–08:30、12:00–12:30（每日總額 108 名，每人每日限 1 次）</p>

<div id="statusPanel" class="status-panel">
<div id="sessionBadge" class="status-badge badge-closed">正在連線確認名額…</div>
<div id="sessionInfo">請稍候</div>
<div class="quota-row">
<span id="quotaText">今日剩餘名額：-- / 108</span>
<span id="userCountText">每日限抽：1 次</span>
</div>
</div>

<div id="todayBox" class="today-box hidden"></div>
<div class="img-box" id="imgBox">🙏</div>
<div class="result-name" id="nameBox"></div>
<div id="controls"><button id="drawBtn" disabled>載入中</button></div>
<div class="jiao" id="jiaoBox"></div>
<div class="msg" id="msg"></div>
<div id="resultCard" class="card hidden"></div>
<p class="small">本程式為文化體驗與心靈沉澱用途，擲筊為模擬（聖筊80%），非正式宗教儀式。</p>
</div>

<script>
const CONFIG = {
  sessionQuota: 108,
  dailyUserLimit: 1
};

const LIFF_ID = "2012839066-lx3J5Jjw";
const API_URL = "";

const SESSIONS = [
  {key:"morning",label:"早場（08:00–08:30）",startMin:480,endMin:510},
  {key:"noon",label:"午場（12:00–12:30）",startMin:720,endMin:750}
];

const LIST = [
{id:"guanyin",name:"觀世音菩薩",image:"https://www.chengji.com.tw/picture/product/zip_6a472897d0d0d.webp",symbol:"大慈大悲、聞聲救苦",vow:"觀世音菩薩以大悲心尋聲救苦，眾生稱念其名，即得解脫苦惱。",blessing:"願你心懷慈悲，煩惱輕安，所行無礙。",sutra:"《妙法蓮華經·普門品》：「若有无量百千万亿众生，受诸苦恼，闻是观世音菩萨，一心称名，观世音菩萨即时观其音声，皆得解脱。」"},
{id:"wenshu",name:"文殊菩薩",image:"https://www.tonshine.com.tw/upload/product/189/1620820614W3931OGQ.jpeg",symbol:"大智、辯才",vow:"文殊菩薩以大智慧斷除煩惱，指引眾生入佛知見。",blessing:"願你智慧明朗，所學通達，斷疑生信。",sutra:"《華嚴經》：「文殊師利常為無量諸佛之母，為諸佛之師。」"},
{id:"dizang",name:"地藏菩薩",image:"https://image-cdn-flare.qdm.cloud/q669d021c53712/image/data/2018/07/12/4b145422fd2e6038e75f6fe908c494dd.jpg",symbol:"大願、孝道、超度",vow:"地藏菩薩發願「地獄不空，誓不成佛」，救度六道苦難。",blessing:"願你孝心圓滿，先亡安樂，現眷安康。",sutra:"《地藏菩薩本願經》：「地獄不空，誓不成佛；眾生度盡，方證菩提。」"},
{id:"yaoshi",name:"藥師佛",image:"https://www.foshanshuan.com.tw/uploadpic/images/201601201703019628.jpg",symbol:"消災延壽、療癒",vow:"藥師佛發十二大願，救濟眾生病苦，令得安樂。",blessing:"願你身心安康，病苦遠離，福壽綿長。",sutra:"《藥師琉璃光如來本願功德經》：「願我來世得菩提時，若諸有情眾病逼切，無救無歸……我之名號一經其耳，眾病悉除，身心安樂。」"},
{id:"amituo",name:"阿彌陀佛",image:"https://image-cdn-flare.qdm.cloud/q669d021c53712/image/data/2019/%E7%B2%BE%E9%9B%95%E9%8A%85%E5%A4%9A%E5%BD%A9%E4%BD%9B%E5%83%8F%E9%98%BF%E5%BD%8C%E9%99%80%E4%BD%9B-BAB108_1024_1_1.jpg",symbol:"無量光壽、接引",vow:"阿彌陀佛以四十八願接引眾生，往生西方極樂淨土。",blessing:"願你心歸淨土，臨終無懼，光明相伴。",sutra:"《佛說阿彌陀經》：「從是西方，過十萬億佛土，有世界名曰極樂，其土有佛，號阿彌陀，今現在說法。」"},
{id:"miles",name:"彌勒佛",image:"https://www.tonshine.com.tw/upload/product/262/1651996043DGT6OHFT.jpeg",symbol:"歡喜、未來希望",vow:"彌勒菩薩當來下生，龍華三會，度化眾生。",blessing:"願你笑口常開，歡喜自在，未來可期。",sutra:"《彌勒上生經》：「彌勒菩薩於未來世，當得作佛，號曰彌勒。」"},
{id:"puxian",name:"普賢菩薩",image:"https://www.foshanshuan.com.tw/uploads/product/2207/15/202207158802049211601730926.jpg",symbol:"大行、實踐",vow:"普賢菩薩以十大願王導歸極樂，力行實踐。",blessing:"願你行願堅固，所行皆成，步步踏實。",sutra:"《華嚴經·普賢行願品》：「虛空界盡，眾生界盡，眾生業盡，眾生煩惱盡，我此願王無有窮盡。」"},
{id:"dashi",name:"大勢至菩薩",image:"https://www.tonshine.com.tw/upload/product/190/1620821721UHKIG1CC.jpeg",symbol:"大勢、念佛圓通",vow:"大勢至菩薩以念佛圓通，攝受眾生往生淨土。",blessing:"願你信願堅定，念佛得力，心不散亂。",sutra:"《楞嚴經·大勢至菩薩念佛圓通章》：「都攝六根，淨念相繼，得三摩地，斯為第一。」"},
{id:"xukong",name:"虛空藏菩薩",image:"https://upload.wikimedia.org/wikipedia/commons/8/8b/Akasagarbha_at_Buddha_Tooth_Relic_Temple_and_Museum.JPG?utm_source=zh.wikipedia.org&utm_campaign=index&utm_content=original",symbol:"福德、記憶",vow:"虛空藏菩薩如虛空般含藏無量福德智慧，滿眾生願。",blessing:"願你福德增長，記憶清明，所求滿願。",sutra:"《虛空藏菩薩經》：「虛空藏菩薩摩訶薩，常以福德智慧，滿一切眾生所願。」"},
{id:"sakyamuni",name:"釋迦牟尼佛",image:"https://image-cdn-flare.qdm.cloud/q669d021c53712/image/data/2020/01/02/224999e6a421e20ab65dfb61a11f94cf.jpg",symbol:"覺悟、教化",vow:"釋迦牟尼佛示現成道，說法度眾，開示悟入佛之知見。",blessing:"願你覺察當下，離苦得樂，正念常存。",sutra:"《法華經·方便品》：「諸佛世尊唯以一大事因緣故出現於世……欲令眾生開佛知見。」"},
{id:"zhunti",name:"準提菩薩",image:"https://image-cdn-flare.qdm.cloud/q669d021c53712/image/data/2018/07/12/f9793089085dbb4aa71a3084338415df.jpg",symbol:"滿願、修持",vow:"準提菩薩以準提咒利益眾生，滿一切願。",blessing:"願你修持得力，善願成就，障礙消除。",sutra:"《準提陀羅尼經》：「若有眾生持此陀羅尼，一切所求無不遂願。」"},
{id:"lvdu",name:"綠度母",image:"https://ch.tbsn.org/images/2019_07_26/thangka-green-tara.jpg",symbol:"救度、迅速滿願",vow:"綠度母以大悲迅速救度眾生，滿願除怖。",blessing:"願你遠離怖畏，所求速成，平安吉祥。",sutra:"《度母讚》：「救度輪迴諸怖畏，度母眷屬我敬禮。」"},
{id:"dingguang",name:"定光佛",image:"https://upload.wikimedia.org/wikipedia/commons/b/bf/%E9%84%9E%E5%B1%B1%E5%AF%BA%28%E6%B1%80%E5%B7%9E%E6%9C%83%E9%A4%A8%29-DSCN7099.JPG?utm_source=zh.wikipedia.org&utm_campaign=index&utm_content=original",symbol:"授記、光明",vow:"定光佛為釋迦牟尼佛過去世授記之師，以光明照世。",blessing:"願你道心堅定，蒙佛授記，光明在前。",sutra:"《增一阿含經》載定光佛為釋迦菩薩授記。"},
{id:"piluzhena",name:"毗盧遮那佛",image:"https://www.foshanshuan.com.tw/uploadpic/images/202207181626173018.jpg",symbol:"法身、遍一切處",vow:"毗盧遮那佛為法身佛，光明遍照，含藏萬法。",blessing:"願你心包太虛，智慧遍照，理事無礙。",sutra:"《華嚴經》：「毗盧遮那佛，法身遍法界。」"},
{id:"yaowang",name:"藥王菩薩",image:"",symbol:"施藥、捨身",vow:"藥王菩薩以醫藥救眾生病苦，發願療治一切。",blessing:"願你身心調和，病苦遠離，善願成就。",sutra:"《法華經·藥王菩薩本事品》載其燃身供佛之願行。"}
];

const ZHAI_MAP={1:"dingguang",8:"yaoshi",14:"puxian",15:"amituo",18:"guanyin",23:"dashi",24:"dizang",28:"piluzhena",29:"yaowang",30:"sakyamuni"};

const $=id=>document.getElementById(id);
const imgBox=$("imgBox"),nameBox=$("nameBox"),jiaoBox=$("jiaoBox"),msg=$("msg"),controls=$("controls"),resultCard=$("resultCard"),todayBox=$("todayBox"),sessionBadge=$("sessionBadge"),sessionInfo=$("sessionInfo"),quotaText=$("quotaText"),userCountText=$("userCountText");

let current=null,shengCount=0,isDrawing=false,idToken=null,activeSession=null,alreadyDrawn=false,reserved=false,refreshTimer=null;

function getTaiwanMinute(){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Taipei",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const get=t=>Number(parts.find(p=>p.type===t).value);
  return get("hour")*60+get("minute");
}
function getActiveSession(){
  const mins=getTaiwanMinute();
  return SESSIONS.find(s=>mins>=s.startMin&&mins<s.endMin)||null;
}
function getStatusSession(){
  const active=getActiveSession();
  if(active)return active;
  const mins=getTaiwanMinute();
  return SESSIONS.find(s=>s.startMin>mins)||SESSIONS[1];
}
function getNextHint(){
  const mins=getTaiwanMinute();
  if(mins<480)return "下一場：今日早場 08:00–08:30 開放";
  if(mins<720)return "下一場：今日午場 12:00–12:30 開放";
  return "今日抽選已結束，明日 08:00–08:30 再開放";
}
function rand(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n}
function tossJiaoResult(){
  const r=rand(100);
  if(r<80)return "sheng";
  if(r<90)return "xiao";
  return "yin";
}
async function api(path,session){
  const response=await fetch(API_URL+path,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({idToken,session})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok){
    const error=new Error(data.message||data.error||"伺服器暫時無法處理");
    error.status=response.status;
    error.data=data;
    throw error;
  }
  return data;
}
function renderCounts(data){
  quotaText.textContent=`今日剩餘名額：${data.remaining} / 108`;
  userCountText.textContent="每日限抽：1 次";
}
function setDrawButton(label,disabled){
  controls.innerHTML=`<button id="drawBtn" ${disabled?"disabled":""}>${label}</button>`;
  if(!disabled)$("drawBtn").onclick=startDraw;
}
async function refreshStatus(){
  if(!idToken)return;
  const session=getStatusSession();
  try{
    const data=await api("/api/status",session.key);
    alreadyDrawn=!!data.alreadyDrawn;
    renderCounts(data);
    if(alreadyDrawn){
      sessionBadge.className="status-badge badge-closed";
      sessionBadge.textContent="今日已完成登記";
      sessionInfo.textContent="每位居士每日限抽一次；早場與午場合計每日 108 名。";
      setDrawButton("今日已完成抽選",true);
      return;
    }
    activeSession=getActiveSession();
    if(!activeSession){
      sessionBadge.className="status-badge badge-closed";
      sessionBadge.textContent="非開放時段";
      sessionInfo.textContent=getNextHint();
      setDrawButton("非開放時段",true);
      return;
    }
    sessionBadge.className="status-badge badge-open";
    sessionBadge.textContent=`開放中 · ${activeSession.label}`;
    sessionInfo.textContent="早場與午場合計每日 108 名額，每人每日限登記一次。";
    if(Number(data.remaining)<=0){
      sessionBadge.textContent="今日名額已滿";
      sessionInfo.textContent="今日 108 個名額已用完，請明日再來。";
      setDrawButton("今日名額已滿",true);
    }else{
      setDrawButton("抽聖像",false);
    }
  }catch(error){
    sessionBadge.className="status-badge badge-closed";
    sessionBadge.textContent="連線確認失敗";
    sessionInfo.textContent=error.message;
    setDrawButton("暫時無法抽選",true);
  }
}
function renderImage(deity){
  if(!deity.image)return `<div class="placeholder">${deity.name}<br><small>聖像待補</small></div>`;
  return `<img src="${deity.image}" alt="${deity.name}" onerror="this.parentNode.innerHTML='<div class=&quot;placeholder&quot;>${deity.name}<br><small>聖像待補</small></div>'">`;
}
function showToday(){
  if(typeof Lunar==="undefined")return;
  try{
    const lunar=Lunar.fromDate(new Date());
    const id=ZHAI_MAP[lunar.getDay()];
    if(!id)return;
    const deity=LIST.find(x=>x.id===id);
    if(!deity)return;
    todayBox.classList.remove("hidden");
    todayBox.innerHTML=`<div class="today-label">今日十齋日 · 農曆${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}</div><div class="today-name">${deity.name}</div><div class="today-blessing">${deity.blessing}</div>`;
  }catch(e){console.warn("十齋日資料載入失敗",e)}
}
async function startDraw(){
  if(isDrawing||alreadyDrawn||reserved)return;
  activeSession=getActiveSession();
  if(!activeSession){
    msg.textContent=getNextHint();
    await refreshStatus();
    return;
  }
  isDrawing=true;
  setDrawButton("確認登記中…",true);
  msg.textContent="正在向伺服器確認抽選資格，請稍候…";
  try{
    const data=await api("/api/draw",activeSession.key);
    if(!data.success||!data.drawn)throw new Error(data.message||"登記未成功");
    reserved=true;
    alreadyDrawn=true;
    await refreshStatusAfterDraw();
    beginAnimation();
  }catch(error){
    isDrawing=false;
    if(error.status===409){
      msg.textContent=error.message;
      await refreshStatus();
    }else{
      msg.textContent="連線或登記失敗："+error.message+"。請稍後再試。";
      setDrawButton("重新確認",false);
    }
  }
}
async function refreshStatusAfterDraw(){
  try{
    const data=await api("/api/status",activeSession.key);
    renderCounts(data);
  }catch(e){}
}
function beginAnimation(){
  current=null;
  shengCount=0;
  jiaoBox.textContent="";
  nameBox.textContent="";
  resultCard.classList.add("hidden");
  resultCard.innerHTML="";
  msg.textContent="抽選中…";
  controls.innerHTML="<button disabled>抽聖像</button>";
  imgBox.classList.add("rotating");
  imgBox.innerHTML="🙏";
  let ticks=0;
  const timer=setInterval(()=>{
    nameBox.textContent=LIST[rand(LIST.length)].name;
    ticks++;
    if(ticks>20){
      clearInterval(timer);
      imgBox.classList.remove("rotating");
      current=LIST[rand(LIST.length)];
      imgBox.innerHTML=renderImage(current);
      nameBox.textContent=current.name;
      msg.textContent="請擲筊請示是否為此尊（需連續三聖筊）";
      isDrawing=false;
      showJiaoButtons();
    }
  },80);
}
function showJiaoButtons(){
  controls.innerHTML='<button id="jiaoBtn">擲筊</button>';
  $("jiaoBtn").onclick=tossJiao;
}
function tossJiao(){
  const result=tossJiaoResult();
  const map={sheng:{emoji:"⚪⚪",text:"聖筊"},xiao:{emoji:"⚪⚫",text:"笑筊"},yin:{emoji:"⚫⚫",text:"陰筊"}};
  jiaoBox.textContent=map[result].emoji;
  if(result==="sheng"){
    shengCount++;
    msg.textContent=`聖筊！目前連續 ${shengCount} / 3`;
    if(shengCount>=3)showResult();
  }else{
    shengCount=0;
    msg.textContent=`${map[result].text}，連續聖筊中斷。可再擲筊請示。`;
  }
}
function showResult(){
  jiaoBox.textContent="⚪⚪ ⚪⚪ ⚪⚪";
  msg.textContent="三聖筊確認！";
  resultCard.classList.remove("hidden");
  resultCard.innerHTML=`<p><span class="label">象徵：</span>${current.symbol}</p><p><span class="label">願力：</span>${current.vow}</p><p class="blessing">${current.blessing}</p><p class="sutra">${current.sutra}</p>`;
  controls.innerHTML='<button id="shareBtn" class="ghost">分享結果</button>';
  $("shareBtn").onclick=shareResult;
}
async function shareResult(){
  const text=`我抽到與我有緣的${current.name}：${current.blessing}`;
  if(navigator.share){
    try{await navigator.share({title:"佛菩薩聖像抽選",text})}catch(e){}
  }else{
    try{await navigator.clipboard.writeText(text);msg.textContent="已複製結果，可貼到社群分享"}
    catch(e){msg.textContent=text}
  }
}
async function initApp(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }
    idToken=liff.getIDToken();
    if(!idToken){
      sessionBadge.textContent="LINE 身分驗證未完成";
      sessionInfo.textContent="請確認 LINE LIFF 已啟用 openid 權限。";
      msg.textContent="目前無法取得 LINE ID Token，請檢查 LIFF 的 openid 權限設定。";
      setDrawButton("尚未完成 LINE 驗證",true);
      return;
    }
    showToday();
    await refreshStatus();
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(refreshStatus,30000);
  }catch(error){
    sessionBadge.textContent="LINE 載入失敗";
    sessionInfo.textContent="請從 LINE 官方帳號內重新開啟本頁。";
    msg.textContent="LIFF 初始化失敗："+error.message;
    setDrawButton("無法連線",true);
  }
}
initApp();
</script>
